ServerName localhost
ServerTokens Prod
ServerSignature Off
Timeout 12
KeepAliveTimeout 2
MaxKeepAliveRequests 100

<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 "%h %t %m %>s %b"
</VirtualHost>
