scope: festival
namespace: /service/

log:
  level: INFO
  traceback_level: DEBUG

restapi:
  listen: 0.0.0.0:8008

etcd3:
  hosts: etcd1:2379,etcd2:2379,etcd3:2379
  protocol: http

bootstrap:
  dcs:
    ttl: 20
    loop_wait: 5
    retry_timeout: 5
    maximum_lag_on_failover: 0
    check_timeline: true
    synchronous_mode: true
    synchronous_mode_strict: true
    synchronous_node_count: 1
    primary_stop_timeout: 10
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        hot_standby: 'on'
        wal_log_hints: 'on'
        max_wal_senders: 10
        max_replication_slots: 10
        max_connections: 100
        shared_buffers: 128MB
        synchronous_commit: 'on'
        password_encryption: scram-sha-256
        log_statement: none
        log_min_error_statement: fatal
        log_line_prefix: '%m [%p] %q%u@%d '
  initdb:
    - encoding: UTF8
    - data-checksums
    - auth-local: trust
    - auth-host: scram-sha-256
  pg_hba:
    - local all all trust
    - host replication replicator 0.0.0.0/0 scram-sha-256
    - host all all 0.0.0.0/0 scram-sha-256

postgresql:
  listen: 0.0.0.0:5432
  data_dir: /var/lib/postgresql/data/pgdata
  bin_dir: /usr/lib/postgresql/16/bin
  pgpass: /var/lib/postgresql/data/pgpass
  authentication:
    superuser:
      username: postgres
    replication:
      username: replicator
  create_replica_methods:
    - basebackup
  basebackup:
    checkpoint: fast
  remove_data_directory_on_rewind_failure: true
  remove_data_directory_on_diverged_timelines: true

# Le noyau local est partagé. Aucun fencing indépendant n'est revendiqué par ce lab.
watchdog:
  mode: 'off'

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
