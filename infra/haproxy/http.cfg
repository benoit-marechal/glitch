global
    log stdout format raw local0
    maxconn 512

defaults
    log global
    mode http
    # Les URL de contrôle contiennent un jeton de billet. Aucun chemin ni en-tête n'est journalisé.
    log-format "%ci:%cp [%tr] %ft %b/%s %ST %B %Tq/%Tw/%Tc/%Tr/%Tt"
    timeout connect 3s
    timeout client 20s
    timeout server 20s
    timeout http-request 5s
    timeout http-keep-alive 2s
    timeout queue 5s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend public_http
    bind :8080
    default_backend applications

backend applications
    balance roundrobin
    option forwardfor
    option httpchk
    http-check send meth GET uri /livez ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 resolvers docker init-addr libc,none
    server web1 web1:80 check
    server web2 web2:80 check
