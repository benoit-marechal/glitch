global
    log stdout format raw local0
    maxconn 256

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 3s
    # Borner l'attente réseau sans annuler COMMIT pendant sa confirmation synchrone.
    timeout client 8s
    timeout server 6s
    timeout queue 5s
    timeout check 2s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend postgresql
    bind :5432
    default_backend primary

backend primary
    option httpchk
    http-check send meth GET uri /primary ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
    server pg1 pg1:5432 check port 8008
    server pg2 pg2:5432 check port 8008
    server pg3 pg3:5432 check port 8008
